<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automated Display</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }
        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .mySlides {
            display: none;
            width: 100%;
            height: 100%;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .fade {
            animation-name: fade;
            animation-duration: 1.5s;
        }
        @keyframes fade {
            from {opacity: 0.4} 
            to {opacity: 1}
        }
    </style>
</head>
<body>

<div class="slideshow-container">
    <div class="mySlides fade"><img src="SCTT_new.png"></div>
    <div class="mySlides fade"><img src="Nova_1.jpg"></div>
    <div class="mySlides fade"><img src="Nova_2.jpg"></div>
    <div class="mySlides fade"><img src="Nova_3.jpg"></div>
    <div class="mySlides fade"><img src="Nova_4.jpg"></div>
    <div class="mySlides fade"><img src="Nova_5.jpg"></div>
    <div class="mySlides fade"><img src="Nova_6.jpg"></div>
    <div class="mySlides fade"><img src="Nova_7.jpg"></div>
</div>

<script>
    let slideIndex = 0;
    showSlides();

    function showSlides() {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        
        // Hide all slides
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";  
        }
        
        slideIndex++;
        
        // Loop back to the first image
        if (slideIndex > slides.length) {slideIndex = 1}    
        
        slides[slideIndex-1].style.display = "block";  
        
        // Change image every 4 seconds (4000ms)
        setTimeout(showSlides, 4000); 
    }
</script>

</body>
</html>
